[workspace]
resolver = "2"
members = ["crates/doris-proto", "crates/doris-segment"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
doris-proto = { path = "crates/doris-proto" }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
crc32c = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.14"
zstd = "0.14"
