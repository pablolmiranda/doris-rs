[workspace]
resolver = "2"
members = [
    "crates/doris-be",
    "crates/doris-fixtures",
    "crates/doris-proto",
    "crates/doris-rocks",
    "crates/doris-rs",
    "crates/doris-segment",
    "crates/doris-storage",
    "crates/doris-thrift",
    "crates/doris-wire",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
doris-proto = { path = "crates/doris-proto" }
doris-thrift = { path = "crates/doris-thrift" }
doris-storage = { path = "crates/doris-storage" }
doris-be = { path = "crates/doris-be" }
doris-fixtures = { path = "crates/doris-fixtures" }
doris-rocks = { path = "crates/doris-rocks" }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
crc32c = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.14"
snap = "1"
rustix = { version = "1", features = ["fs"] }
zstd = "0.14"
thrift = "0.25"
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "io-util"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
pbjson = "0.9"
pbjson-build = "0.9"
tempfile = "3"
fs4 = "1"
