[workspace]
resolver = "2"
members = [
    "crates/doris-be",
    "crates/doris-exec",
    "crates/doris-fixtures",
    "crates/doris-proto",
    "crates/doris-rocks",
    "crates/doris-rs",
    "crates/doris-segment",
    "crates/doris-storage",
    "crates/doris-thrift",
    "crates/doris-wire",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
doris-proto = { path = "crates/doris-proto" }
doris-thrift = { path = "crates/doris-thrift" }
doris-storage = { path = "crates/doris-storage" }
doris-be = { path = "crates/doris-be" }
doris-fixtures = { path = "crates/doris-fixtures" }
doris-rocks = { path = "crates/doris-rocks" }
doris-segment = { path = "crates/doris-segment" }
doris-exec = { path = "crates/doris-exec" }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
crc32c = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.14"
snap = "1"
rustix = { version = "1", features = ["fs"] }
ruzstd = "0.9"
crc32fast = "1"
thrift = "0.25"
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "io-util"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
pbjson = "0.9"
pbjson-build = "0.9"
tempfile = "3"
fs4 = "1"
# Parquet and ORC stream loads: no arrow for Parquet; orc-rust reads into arrow arrays
parquet = { version = "53", default-features = false, features = ["snap", "flate2", "lz4"] }
orc-rust = { version = "0.6", default-features = false }
# decimal products past 128 bits (M6 s5)
ethnum = "1"
arrow-array = { version = "56", default-features = false }
arrow-schema = { version = "56", default-features = false }
