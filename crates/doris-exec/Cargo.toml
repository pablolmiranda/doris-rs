[package]
name = "doris-exec"
version = "0.1.0"
description = "doris-rs BE execution: write fragments (INSERT VALUES, stream load), constant expressions, the OLAP table sink"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
doris-proto = { workspace = true }
doris-thrift = { workspace = true }
doris-storage = { workspace = true }
doris-segment = { workspace = true }
thrift = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true }
# numbers keep their text (a JSON load's 1.79769e+309 is a field, not a parse error)
serde_json = { workspace = true, features = ["arbitrary_precision"] }

[dev-dependencies]
doris-fixtures = { workspace = true }
tempfile = { workspace = true }
