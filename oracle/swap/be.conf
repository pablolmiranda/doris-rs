# C++ BE configuration for the swap cluster (lib.sh appends storage_root_path and
# priority_networks). doris-rs reads the same file through start_rs, so both binaries take turns
# on one root with the same ports and report intervals.
heartbeat_service_port = 9050
be_port = 9060
brpc_port = 8060
webserver_port = 8040
# short report intervals, so a swap check waits seconds, not minutes, for the FE to see a change
report_tablet_interval_seconds = 5
report_disk_state_interval_seconds = 5
report_task_interval_seconds = 5

# --- reference BE_CONFIG_EXTRA (compose/reference-single.yml, except mem_limit) ---
path_gc_check_interval_second = 1
max_garbage_sweep_interval = 180
enable_stream_load_record = true
stream_load_record_batch_size = 500
max_depth_of_expr_tree = 200
enable_feature_binlog = true
max_sys_mem_available_low_water_mark_bytes = 69206016
user_files_secure_path = /
enable_debug_points = true
enable_debug_log_timeout_secs = 0
enable_missing_rows_correctness_check = true
webserver_num_workers = 128
enable_write_index_searcher_cache = true
enable_batch_download = true
remove_unused_remote_files_interval_sec = 60
cold_data_compaction_interval_sec = 60
enable_parquet_page_index = true
enable_fetch_rowsets_from_peer_replicas = true
enable_segment_rows_consistency_check = true
