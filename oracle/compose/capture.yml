# Packet-capture sidecar for the wire corpus. It shares the reference container's network
# namespace (FE and BE talk over 127.0.0.1 inside it) and records the internal RPC ports from
# the moment it starts. Used together with reference-single.yml by oracle/wire/bin/capture.sh.
services:
  capture:
    image: ${CAPTURE_IMAGE:-nicolaka/netshoot:v0.16}
    network_mode: "service:doris"
    depends_on:
      doris:
        condition: service_started
    volumes:
      - ${CAPTURE_DIR:?set CAPTURE_DIR}:/out
    command:
      - tcpdump
      - -i
      - lo
      - -s
      - "0"
      - -U
      - -w
      - /out/${CAPTURE_FILE:-capture.pcap}
      # CAPTURE_FILTER: the Epic 1 runs add BE HTTP (tcp port 8040) for stream loads
      - ${CAPTURE_FILTER:-tcp port 9020 or tcp port 9050 or tcp port 9060 or tcp port 8060}
